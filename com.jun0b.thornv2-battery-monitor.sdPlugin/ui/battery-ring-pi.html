<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThornV2 Battery Monitor Settings</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 12px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      color: #d8d8d8;
      background-color: #2d2d2d;
      user-select: none;
    }
    .sdpi-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 420px;
    }
    .sdpi-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 28px;
    }
    .sdpi-item-label {
      width: 110px;
      flex-shrink: 0;
      text-align: right;
      color: #9b9b9b;
      font-weight: 500;
    }
    .sdpi-item-label::after {
      content: ":";
      margin-left: 2px;
    }
    .sdpi-item-value {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select,
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      background-color: #3d3d3d;
      color: #e8e8e8;
      border: 1px solid #555555;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
    }
    select:focus,
    input[type="number"]:focus {
      border-color: #0078d4;
    }
    input[type="number"] {
      max-width: 100px;
    }
    .unit-text {
      color: #9b9b9b;
      font-size: 11px;
    }
    .hint-box {
      margin-left: 120px;
      color: #888888;
      font-size: 11px;
      line-height: 1.4;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="sdpi-wrapper">
    <!-- Design selector -->
    <div class="sdpi-item">
      <div class="sdpi-item-label">Design</div>
      <div class="sdpi-item-value">
        <select id="layout-select">
          <option value="ring">Ring</option>
          <option value="bar">Icon</option>
          <option value="bar_dpi">Icon + DPI / Hz</option>
        </select>
      </div>
    </div>

    <!-- Polling Interval (shown only when Bar + DPI / Hz is selected) -->
    <div id="polling-group">
      <div class="sdpi-item">
        <div class="sdpi-item-label">Polling Interval</div>
        <div class="sdpi-item-value">
          <input id="polling-interval-input" type="number" min="5" max="3600" step="1" value="30" />
          <span class="unit-text">sec (5–3600)</span>
        </div>
      </div>
      <div class="hint-box">
        Refresh interval for reading mouse DPI and polling rate (Hz).
      </div>
    </div>
  </div>

  <script>
    let websocket = null;
    let piUUID = "";
    let currentSettings = {
      layout: "ring",
      pollingIntervalSec: 30,
    };

    const layoutSelect = document.getElementById("layout-select");
    const pollingGroup = document.getElementById("polling-group");
    const pollingInput = document.getElementById("polling-interval-input");

    function updateVisibility() {
      if (layoutSelect.value === "bar_dpi") {
        pollingGroup.classList.remove("hidden");
      } else {
        pollingGroup.classList.add("hidden");
      }
    }

    function applySettingsToUI(settings) {
      const layout = settings && (settings.layout === "bar" || settings.layout === "bar_dpi" || settings.layout === "ring")
        ? settings.layout
        : "ring";
      let interval = Number(settings && settings.pollingIntervalSec);
      if (!Number.isFinite(interval) || interval < 5) {
        interval = 30;
      } else if (interval > 3600) {
        interval = 3600;
      } else {
        interval = Math.round(interval);
      }

      currentSettings = {
        ...settings,
        layout,
        pollingIntervalSec: interval,
      };

      layoutSelect.value = layout;
      pollingInput.value = String(interval);
      updateVisibility();
    }

    function saveSettings() {
      const layout = layoutSelect.value;
      let interval = parseInt(pollingInput.value, 10);
      if (!Number.isFinite(interval) || interval < 5) {
        interval = 5;
      } else if (interval > 3600) {
        interval = 3600;
      }
      pollingInput.value = String(interval);

      currentSettings = {
        ...currentSettings,
        layout,
        pollingIntervalSec: interval,
      };
      updateVisibility();

      if (websocket && websocket.readyState === WebSocket.OPEN) {
        websocket.send(
          JSON.stringify({
            event: "setSettings",
            context: piUUID,
            payload: currentSettings,
          })
        );
      }
    }

    layoutSelect.addEventListener("change", () => {
      saveSettings();
    });

    pollingInput.addEventListener("change", () => {
      saveSettings();
    });

    // Stream Deck Property Inspector entry point
    function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
      piUUID = inPropertyInspectorUUID;

      try {
        const actionObj = JSON.parse(inActionInfo);
        const settings = actionObj && actionObj.payload && actionObj.payload.settings ? actionObj.payload.settings : {};
        applySettingsToUI(settings);
      } catch (e) {
        applySettingsToUI(currentSettings);
      }

      websocket = new WebSocket("ws://127.0.0.1:" + inPort);

      websocket.onopen = function () {
        websocket.send(
          JSON.stringify({
            event: inRegisterEvent,
            uuid: inPropertyInspectorUUID,
          })
        );
        websocket.send(
          JSON.stringify({
            event: "getSettings",
            context: inPropertyInspectorUUID,
          })
        );
      };

      websocket.onmessage = function (evt) {
        try {
          const data = JSON.parse(evt.data);
          if (data.event === "didReceiveSettings" && data.payload && data.payload.settings) {
            applySettingsToUI(data.payload.settings);
          }
        } catch (e) {
          // ignore
        }
      };
    }
  </script>
</body>
</html>
